<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up Agro Nation</title>
    <!-- Add icon library -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-image: url(../image/Login-background.jpg);
        background-repeat: no-repeat;
        background-size:cover;
      }
      * {
        box-sizing: border-box;
      }
      .body-div {
        
        height: 100vh;
        width: 50vw;
        margin: auto;
       
        border-radius: 30px;
      }
      .login-form{
        
      }
      .input-container {
        display: -ms-flexbox; /* IE10 */
        display: flex;
        width: 100%;
        margin-bottom: 15px;
      }

      .icon {
        padding: 10px;
        background: dodgerblue;
        color: white;
        min-width: 50px;
        text-align: center;
      }

      .input-field {
        width: 100%;
        padding: 10px;
        outline: none;
      }

      .input-field:focus {
        border: 2px solid dodgerblue;
      }

      /* Set a style for the submit button */
      .btn {
        background-color: dodgerblue;
        color: white;
        padding: 15px 20px;
        border: none;
        cursor: pointer;
        width: 100%;
        opacity: 0.9;
      }

      .btn:hover {
        opacity: 1;
      }
      h5,h1,h2 {
        text-align: center;
        color: white;
        
        
      }
      label,p{
        color: white;
      }
      a{
        color: rgb(217, 27, 27);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="body-div">
      <h1>🌱 Agro Nation</h1>
      <h2>Create Account!</h2>
      <h5>Join Agro Nation today.</h5>
      <form  class="login-form" action="/action_page.php" style="max-width: 500px; margin: auto">
        
        <div class="input-container">
          <i class="fa fa-user icon"></i>
          <input
            class="input-field"
            type="text"
            placeholder="Full Name"
            name="usrnm"
          />
        </div>

        <div class="input-container">
          <i class="fa fa-envelope icon"></i>
          <input
            class="input-field"
            type="email"
            placeholder="Email"
            name="email"
          />
        </div>
        <div class="input-container">
          <i class="fa fa-phone icon"></i>
          <input
            class="input-field"
            type="number"
            placeholder="Phone Number"
            name="Number"
          />
        </div>

        <div class="input-container">
          <i class="fa fa-key icon"></i>
          <input
            class="input-field"
            type="password"
            placeholder="Password (Minimum 6 Character)"
            name="psw"
          />
        </div>
        <div class="input-container">
          <i class="fa fa-key icon"></i>
          <input
            class="input-field"
            type="password"
            placeholder="Re-enter Password"
            name="psw"
          />
        </div>
        <label>
          <input
            type="checkbox"
            checked="checked"
            name="remember"
            style="margin-bottom: 15px"
          />
          Remember me
        </label>

        <button type="submit" class="btn">Sign Up</button>
        <p>Already have an account?<a href="Login.html">Login</a> </p>
         <p>
            <a href="index.html"> ← Back to Home</a>
          </p>
      </form>
    </div>
  </body>
</html>
